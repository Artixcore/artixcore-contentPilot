name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Compile Python sources
        run: python -m compileall -q app.py core chatbot providers publishers ui tests

      - name: Run test suite
        env:
          APP_ENV: test
          APP_DEBUG: "false"
          DATABASE_URL: sqlite:///:memory:
        run: pytest -q

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
