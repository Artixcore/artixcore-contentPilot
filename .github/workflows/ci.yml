name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      APP_DEBUG: "false"
      ALERTS_ENABLED: "false"
      DATABASE_URL: sqlite:///:memory:
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies and scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install bandit pip-audit ruff

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q app.py core chatbot providers publishers ui tests

      - name: Lint security-critical modules
        run: ruff check app.py core/agent.py core/alerts.py core/config_validation.py core/error_handler.py core/validation.py core/schemas.py tests/test_config_validation.py tests/test_error_handler.py tests/test_security_hardening.py tests/test_validation.py

      - name: Run test suite
        run: pytest -q

      - name: Scan Python code for medium and high severity issues
        run: bandit -r app.py core chatbot providers publishers ui -x tests -ll --skip B101

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt --strict
