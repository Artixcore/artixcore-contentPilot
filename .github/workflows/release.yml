name: Release Container

on:
  push:
    branches: [master]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/artixcore/artixcore-contentpilot

jobs:
  verify:
    name: Verify complete release source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: test
      APP_DEBUG: "false"
      ALERTS_ENABLED: "false"
      DATABASE_URL: sqlite:///:memory:
      CONTENTPILOT_ENCRYPTION_KEYS: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      WORKSPACE_API_KEY_PEPPER: release-workspace-api-key-pepper-32-characters
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt
          python -m pip install bandit pip-audit ruff

      - name: Verify dependencies
        run: python -m pip check

      - name: Compile complete source
        run: python -m compileall -q app.py app_complete.py core chatbot providers publishers ui workers tests scripts

      - name: Check likely runtime errors
        run: ruff check app.py app_complete.py core chatbot providers publishers ui workers tests scripts --select E9,F63,F7,F82

      - name: Run complete tests
        run: pytest -q --maxfail=1

      - name: Scan complete application code
        run: bandit -r app.py app_complete.py core chatbot providers publishers ui workers -x tests -ll --skip B101

      - name: Audit declared dependencies
        run: pip-audit --strict --requirement requirements.txt

      - name: Build release candidate image
        run: docker build --tag contentpilot:release-candidate .

      - name: Verify complete entrypoint is present
        run: docker run --rm --entrypoint python contentpilot:release-candidate -m compileall -q app_complete.py core ui workers

  publish:
    name: Publish verified image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Artixcore ContentPilot
            org.opencontainers.image.description=Tenant-isolated AI content and social engagement platform
            org.opencontainers.image.vendor=Artixcore

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Write release summary
        run: |
          echo "## ContentPilot container published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`${IMAGE_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
