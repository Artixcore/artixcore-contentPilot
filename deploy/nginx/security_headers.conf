# Include this file inside the HTTPS server block that proxies ContentPilot.
# HSTS includeSubDomains is safe only when every subdomain is HTTPS capable.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), sync-xhr=(), usb=(), web-share=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
add_header Pragma "no-cache" always;

# Streamlit currently requires inline styles/scripts and eval for parts of its runtime.
# Compensating controls: private access gateway, XSRF protection, frame blocking,
# same-origin resource isolation, and no third-party script origins.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; frame-src 'none'; object-src 'none'; form-action 'self'; manifest-src 'self'; media-src 'self' data: blob: https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' wss: https:; worker-src 'self' blob:; upgrade-insecure-requests" always;

proxy_hide_header X-Powered-By;
proxy_hide_header Server;
server_tokens off;
