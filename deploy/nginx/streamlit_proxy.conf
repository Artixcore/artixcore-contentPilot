# Include inside the HTTPS server block that fronts ContentPilot.
# Replace the upstream name and port when your deployment differs.

location / {
    proxy_pass http://contentpilot-web:8501;
    proxy_http_version 1.1;

    # Streamlit uses a persistent WebSocket connection. Forward upgrade headers
    # explicitly and avoid proxy buffering so one browser session maps to one
    # stable application session.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache_bypass $http_upgrade;

    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    # Do not retry a WebSocket request against another upstream after a partial
    # connection. Retrying can duplicate browser and extension lifecycle hooks.
    proxy_next_upstream off;
}
